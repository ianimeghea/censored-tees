services:
  - type: web
    name: censored-tees
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: store-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DB_PATH
        value: /var/data/store.db
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PRINTIFY_API_TOKEN
        sync: false
      - key: PRINTIFY_SHOP_ID
        sync: false
      - key: PRINTIFY_USER_AGENT
        value: CensoredTees
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
